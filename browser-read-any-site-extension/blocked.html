<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagina interna da extensao</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #05070d;
        color: #f5f7fb;
        font-family: Arial, sans-serif;
      }

      #info-card {
        width: min(440px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #111827;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 26px;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.45;
        color: #d8dee9;
      }

      #page-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      .primary {
        background: #2563eb;
        color: #fff;
      }

      .secondary {
        background: #1f2937;
        color: #e5e7eb;
        border: 1px solid #374151;
      }

      #status {
        min-height: 22px;
        margin-top: 12px;
        color: #93c5fd;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main id="info-card">
      <h1>Pagina interna da extensao</h1>
      <p id="description">
        A `blocked.html` nao faz mais bloqueio. Esta pagina agora serve apenas como atalho de manutencao da extensao.
      </p>
      <div id="page-actions">
        <button id="options-action" class="primary" type="button">Abrir configuracoes</button>
        <button id="extensions-action" class="secondary" type="button">Abrir extensoes</button>
        <button id="close-action" class="secondary" type="button">Fechar aba</button>
      </div>
      <div id="status"></div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
