<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navegador bloqueado</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #05070d;
        color: #f5f7fb;
        font-family: Arial, sans-serif;
      }

      #blocked-card {
        width: min(440px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: #111827;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 26px;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.45;
        color: #d8dee9;
      }

      input {
        width: 100%;
        margin: 12px 0;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #374151;
        background: #0f172a;
        color: #f8fafc;
        font-size: 16px;
      }

      #blocked-actions,
      #recipient-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      .primary {
        background: #2563eb;
        color: #fff;
      }

      .secondary {
        background: #1f2937;
        color: #e5e7eb;
        border: 1px solid #374151;
      }

      #recipient-picker {
        display: none;
        margin-top: 14px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #374151;
        background: rgba(15, 23, 42, 0.9);
      }

      #recipient-picker p {
        margin-bottom: 10px;
      }

      #status {
        min-height: 22px;
        margin-top: 12px;
        color: #fbbf24;
        font-size: 14px;
      }

      #post-unlock {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(37, 99, 235, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.25);
        color: #dbeafe;
      }
    </style>
  </head>
  <body>
    <main id="blocked-card">
      <h1>Navegador bloqueado</h1>
      <p id="description">
        Esta sessao fica bloqueada em uma aba interna da extensao ate que o codigo correto seja validado.
      </p>
      <input id="code-input" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="Cole o codigo recebido" />
      <div id="blocked-actions">
        <button id="request-access-action" class="secondary" type="button" style="display: none;">Liberar agora</button>
        <button id="reload-action" class="secondary" type="button">Recarregar extensao</button>
        <button id="primary-action" class="primary" type="button">Liberar acesso</button>
      </div>
      <div id="recipient-picker"></div>
      <div id="status"></div>
      <div id="post-unlock">Acesso liberado. Agora voce pode abrir novas abas normalmente.</div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
