<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Read Any Site - Configuracao</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      h1 {
        margin-top: 0;
      }

      .card {
        background: #111827;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 24px;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-weight: 700;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #020617;
        color: #e2e8f0;
      }

      button {
        margin-top: 18px;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      code {
        background: #020617;
        padding: 2px 6px;
        border-radius: 6px;
      }

      .hint,
      .status {
        line-height: 1.5;
        color: #cbd5e1;
      }

      .status {
        min-height: 24px;
        margin-top: 14px;
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Configuracao de desbloqueio</h1>
        <p class="hint">
          Ao abrir o navegador, a extensao gera um codigo temporario e envia um POST
          JSON para o webhook abaixo. O backend escolhe o email de destino com base
          no ID desta extensao.
        </p>

        <p class="hint">
          ID desta extensao: <code id="extension-id">carregando...</code>
        </p>

        <label for="webhook-url">Webhook de envio</label>
        <input id="webhook-url" type="url" placeholder="https://seu-projeto.vercel.app/api/send-code" />

        <label for="webhook-token">Token do webhook</label>
        <input id="webhook-token" type="password" placeholder="Opcional" />

        <button id="save-config" type="button">Salvar configuracao</button>
        <div id="status" class="status"></div>
      </div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
